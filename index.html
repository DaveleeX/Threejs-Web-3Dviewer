<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="通用 3D 模型预览器 — 支持 glTF/GLB、OBJ、FBX、STL、PLY、3MF、DAE、USDZ 与高斯泼溅资产" />
    <title>DaveLeeX Space</title>
  </head>

  <body class="home-mode">
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
      </symbol>
      <symbol id="i-camera" viewBox="0 0 24 24">
        <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.2-2h8.2l1.2 2h2.2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" />
        <circle cx="12" cy="13" r="3.4" />
      </symbol>
      <symbol id="i-video" viewBox="0 0 24 24">
        <rect x="3" y="6" width="12" height="12" rx="2" />
        <path d="M15 10.5 21 7v10l-6-3.5z" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8 19 12 7 19.2z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" />
      </symbol>
      <symbol id="i-cube" viewBox="0 0 24 24">
        <path d="M12 2.8 21 7.4v9.2L12 21.2 3 16.6V7.4z" /><path d="M3 7.4 12 12m0 0 9-4.6M12 12v9.2" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l1.92-1.92a5 5 0 0 0-7.07-7.07L10.8 6.14" />
        <path d="M14 11a5 5 0 0 0-7.54-.54L4.54 12.4a5 5 0 0 0 7.07 7.07L13.2 17.86" />
      </symbol>
    </svg>

    <div id="app">
      <canvas id="viewport"></canvas>

      <div id="sketchfab-stage" class="sketchfab-stage hidden">
        <iframe
          id="sketchfab-frame"
          title="Sketchfab 预览"
          allow="autoplay; fullscreen; xr-spatial-tracking; gyroscope; accelerometer"
          allowfullscreen
        ></iframe>
        <button id="btn-close-sketchfab" type="button" class="sketchfab-exit" title="关闭预览，返回首页" aria-label="关闭预览，返回首页" aria-label="关闭预览，返回首页">
          <svg class="ico"><use href="#i-close" /></svg>
        </button>
      </div>

      <!-- Empty state / primary upload call to action -->
      <div id="empty-state" class="empty-state">
        <canvas id="empty-cube-bg" class="empty-cube-bg" aria-hidden="true"></canvas>
      </div>

      <div id="open-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="open-dialog-title">
        <div class="dialog-backdrop" data-dialog-dismiss></div>
        <div class="dialog-card">
          <div class="dialog-head">
            <h2 id="open-dialog-title">打开模型</h2>
            <button id="open-dialog-close" class="icon-btn" type="button" title="关闭">
              <svg class="ico"><use href="#i-close" /></svg>
            </button>
          </div>
          <div class="source-toggle" role="tablist" aria-label="打开方式">
            <button id="dialog-source-file" type="button" class="is-active" role="tab">本地文件</button>
            <button id="dialog-source-sketchfab" type="button" role="tab">Sketchfab 链接</button>
          </div>
          <div id="dialog-file-pane">
            
            <button id="dialog-open-files" class="btn btn-primary" type="button">
              <svg class="ico"><use href="#i-upload" /></svg>
              选择模型文件
            </button>
          </div>
          <div id="dialog-sketchfab-pane" class="hidden">
            
            <form id="dialog-sketchfab-form" class="sketchfab-form">
              <input
                id="dialog-sketchfab-url"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="https://sketchfab.com/3d-models/…"
              />
              <button class="btn btn-primary" type="submit">载入预览</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Drag hover overlay -->
      <div id="drop-overlay" class="drop-overlay"><div class="drop-inner">松开以载入模型或用视频生成 3DGS</div></div>

      <nav class="import-dock" aria-label="添加模型">
          <button id="btn-open" class="btn btn-ghost" title="打开模型" aria-label="打开模型">
            <svg class="ico"><use href="#i-upload" /></svg>
          </button>
          <button id="btn-sketchfab" class="btn btn-ghost" title="用 Sketchfab 链接预览" aria-label="用 Sketchfab 链接预览">
            <svg class="ico"><use href="#i-link" /></svg>
          </button>
      </nav>

      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-home" class="btn btn-ghost" title="返回首页" aria-label="返回首页"><svg class="ico" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10" /></svg></button>
          <span class="brand"><svg class="ico"><use href="#i-cube" /></svg>DaveLeeX Space</span>
          <nav class="social-links" aria-label="个人主页">
            <a href="https://sketchfab.com/daveleeX" target="_blank" rel="noopener noreferrer" aria-label="Sketchfab 主页" title="Sketchfab"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="m12 5 6 3.5v7L12 19l-6-3.5v-7Zm0 7 6-3.5M12 12 6 8.5m6 3.5v7"/></svg></a>
            <a href="https://github.com/DaveleeX?tab=repositories" target="_blank" rel="noopener noreferrer" aria-label="GitHub 主页" title="GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.58 9.58 0 0 1 12 6.82c.85 0 1.71.11 2.51.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
            </a>
            <a class="social-xhs" href="https://www.xiaohongshu.com/user/profile/5cf93d010000000025006c74" target="_blank" rel="noopener noreferrer" aria-label="小红书主页" title="小红书"><span aria-hidden="true">小红书</span></a>
          </nav>
          <span id="model-name" class="model-name"></span>
        </div>
        <div class="topbar-right">
          <button id="btn-reset" class="btn btn-ghost" title="重置视角" aria-label="重置视角">
            <svg class="ico"><use href="#i-reset" /></svg>
          </button>
          <button id="btn-shot" class="btn btn-ghost" title="截图 (PNG)" aria-label="截图 (PNG)">
            <svg class="ico"><use href="#i-camera" /></svg>
          </button>
          <button id="btn-record" class="btn btn-ghost" title="录制视频" aria-label="录制视频">
            <svg class="ico"><use href="#i-video" /></svg>
          </button>
          <button id="btn-fullscreen" class="btn btn-ghost" title="全屏" aria-label="全屏">
            <svg class="ico"><use href="#i-expand" /></svg>
          </button>
          <button id="btn-sidebar" class="btn btn-ghost" title="显示/隐藏面板 (Tab)" aria-label="显示/隐藏面板 (Tab)">
            <svg class="ico"><use href="#i-panel" /></svg>
          </button>
        </div>
      </header>

      <!-- Settings sidebar (panels injected at runtime) -->
      <aside id="sidebar" class="sidebar"></aside>

      <canvas id="gs-preview" class="gs-preview hidden" aria-hidden="true"></canvas>
      <div id="gs-stage" class="gs-stage hidden">
        <video id="gs-source-video" class="gs-source-video hidden" muted playsinline loop></video>
        <div id="gs-frames" class="gs-frames"></div>
      </div>

      <!-- View cube / orientation presets -->
      <div id="view-presets" class="view-presets"></div>

      <!-- Animation timeline -->
      <div id="timeline" class="timeline hidden"></div>

      <!-- Stats readout -->
      <div id="stats" class="stats"></div>

      <div id="progress" class="progress hidden">
        <div class="progress-card">
          <div class="spinner"></div>
          <div class="progress-text">载入中…</div>
          <div id="progress-hint" class="progress-hint">拖拽画面可环绕查看正在生长的高斯</div>
          <div class="progress-track"><div class="progress-fill"></div></div>
          <div id="progress-actions" class="progress-actions hidden">
            <button id="progress-finish" class="btn" type="button">提前结束并导出</button>
            <button id="progress-cancel" class="btn" type="button">取消</button>
          </div>
        </div>
      </div>

      <div id="gs-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="gs-dialog-title">
        <div class="dialog-backdrop" data-gs-dismiss></div>
        <div class="dialog-card">
          <div class="dialog-head">
            <h2 id="gs-dialog-title">从视频生成 3DGS</h2>
            <button id="gs-dialog-close" class="icon-btn" type="button" title="关闭">
              <svg class="ico"><use href="#i-close" /></svg>
            </button>
          </div>
          <p id="gs-dialog-copy" class="dialog-copy">在浏览器里本地训练高斯泼溅，不会上传。需要 WebGPU，请保持这个标签页在前台。</p>
          <p id="gs-dialog-env" class="dialog-env">正在检测 WebGPU…</p>
          <label class="gs-quality">
            <span>质量</span>
            <select id="gs-quality">
              <option value="draft">草稿（较快，约数分钟）</option>
              <option value="standard" selected>标准（更清晰，约 10 分钟）</option>
              <option value="high">高质量（更多帧 · SH3，约十几到三十分钟）</option>
            </select>
          </label>
          <p id="gs-quality-hint" class="gs-quality-hint">约 80 张帧、2.5 万步、2 阶球谐。一般绕拍视频用这一档。</p>
          <div class="empty-actions" style="margin-top: 16px">
            <button id="gs-dialog-start" class="btn btn-primary" type="button">开始生成</button>
            <button id="gs-dialog-skip" class="btn" type="button">不用视频</button>
          </div>
        </div>
      </div>

      <div id="toasts" class="toasts"></div>

      <input id="file-input" type="file" multiple hidden />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
